# Site settings
title: "徐云成-生态水动力学课题组 Eco-Hydrodynamics Group"
title1: "徐云成-生态水动力学课题组<br>Eco-Hydrodynamics Group"
email: ycxu@cau.edu.cn
description: "生态水动力学课题组（Eco-Hydro Group）由中国农业大学徐云成副教授负责。课题组以水动力学为方法内核、以农业生态系统为研究对象，围绕农业水动力学与数值模拟、智慧农田感知与无人系统、精准灌溉与水肥一体化智能装备、农业水土系统建模与可持续性评价四大方向，形成\"机理解析→智能感知→精准调控→系统评价\"的完整研究体系。The Eco-Hydrodynamics Research Group (Eco-Hydro Group), led by Prof. Yuncheng Xu at China Agricultural University, takes hydrodynamics as its methodological core and agricultural ecosystems as its object of study, advancing four integrated directions: agricultural hydrodynamics and numerical simulation, smart farmland sensing and unmanned systems, precision irrigation and water-fertilizer equipment, and water-soil system modeling and sustainability assessment."

- name: 徐云成<br>Yuncheng Xu
  photo: yuncheng_xu.jpg
  info: 江苏江阴人，民主同盟盟员，博士研究生导师，主要从事智慧灌溉技术与装备、生态水动力学、CFD模型开发等研究工作。主持国家自然科学基金项目1项，主持国家重点研发项目子课题1项，主持国家重点实验室开放基金1项，骨干参与国家重点研发计划等国家级项目3项，累计项目经费400余万元。在Journal of Hydraulic Engineering、International Journal for Numerical Methods in Fluids、Journal of Fluids Engineering、Coastal Engineering、农业工程学报等期刊发表学术论文30余篇，其中第一作者/通讯作者发表SCI/EI论文10余篇，申请发明专利9项（已授权5项）。目前兼任北京市农业工程学会理事、International Journal of Sediment Research 青年编委，中国农业工程学会、AGU、IAHR会员，International Journal of Sediment Transport 青年编委，以及Journal of Computational Physics、Journal of Hydraulic Engineering、Journal of Hydrology, Geomorphology、Computers and Electronics in Agriculture、Journal of Hydrology等期刊审稿专家。
  info_en: Native of Jiangyin, Jiangsu Province; member of the China Democratic League and a doctoral supervisor. His research focuses on smart irrigation technology and equipment, eco-hydrodynamics, and CFD model development. He has led one project funded by the National Natural Science Foundation of China, one sub-project of the National Key R&D Program, and one open fund project of a State Key Laboratory, and has served as a key member in three national-level projects including the National Key R&D Program, with cumulative project funding of more than 4 million RMB. He has published more than 30 academic papers in journals such as Journal of Hydraulic Engineering, International Journal for Numerical Methods in Fluids, Journal of Fluids Engineering, Coastal Engineering and Transactions of the CSAE, including more than 10 SCI/EI papers as first author or corresponding author, and has applied for 9 invention patents (5 granted). He currently serves as a council member of the Beijing Society of Agricultural Engineering, a youth editorial board member of International Journal of Sediment Research and International Journal of Sediment Transport, and a member of the Chinese Society of Agricultural Engineering, AGU and IAHR. He is also a reviewer for journals including Journal of Computational Physics, Journal of Hydraulic Engineering, Journal of Hydrology, Geomorphology and Computers and Electronics in Agriculture.
